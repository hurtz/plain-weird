name: Keep project pages in sync

# Whenever the project list in index.html changes, rebuild the plain pages
# that search engines and AI answer engines read (p/, projects/, sitemap, llms.txt).
on:
  push:
    branches: [main]
    paths: ["index.html", "img/**", "tools/seo/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/seo/build.mjs
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "plain-weird-bot"
            git config user.email "plain-weird-bot@users.noreply.github.com"
            git add -A
            git commit -m "Rebuild project pages for search"
            git push
          fi
