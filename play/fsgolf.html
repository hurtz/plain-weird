C.mv=function(a){if(a.length<2)return print("usage: mv src... dest","e");var dst=a.pop(),dn=resolve(dst),ok=false;
  if(a.length>1&&(!dn||!dn.dir))return print("mv: "+dst+": Not a directory","e");
  a.forEach(function(s){var sn=resolve(s);if(!sn)return print("mv: "+s+": No such file or directory","e");if(sn===home)return print("mv: cannot move the hole itself","e");
    var target,newName;
    if(dn&&dn.dir){target=dn;newName=sn.name}else{var sp=splitPath(dst);target=resolve(sp[0]);newName=sp[1];if(!target||!target.dir)return print("mv: "+dst+": No such file or directory","e")}
    if(!inHole(target)&&target!==home)return print("mv: "+dst+": Permission denied (outside the hole)","e");
    for(var x=target;x&&x!==root;x=x.parent)if(x===sn)return print("mv: cannot move "+s+" into itself","e");
    if(target.kids[newName]&&target.kids[newName]!==sn){if(target.kids[newName].dir)return print("mv: "+newName+": Directory exists","e")}
    delete sn.parent.kids[sn.name];sn.name=newName;sn.parent=target;target.kids[newName]=sn;ok=true;
  });return ok};
C.rm=function(a){var r=false;while(a[0]&&a[0][0]==="-"){if(/r/.test(a[0]))r=true;a=a.slice(1)}
  if(a.some(function(p){return p==="/"||p==="/*"}))return print("rm: nice try. the PDP-11 thanks you for your restraint.","e");
  var ok=false;a.forEach(function(p){var t=resolve(p);if(!t)return print("rm: "+p+": No such file or directory","e");if(t===home||!inHole(t))return print("rm: "+p+": Permission denied","e");
    if(t.dir&&!r)return print("rm: "+p+": is a directory","e");
    if(!t.dir&&t.meta.tags[0]!=="junk"&&!t.meta.dup)print("rm: removed "+t.name+" (not junk. fsck will not miss it, but you might)","d");
    for(var x=cwd;x&&x!==root;x=x.parent)if(x===t){cwd=home;break}delete t.parent.kids[t.name];ok=true});return ok};
C.rmdir=function(a){var ok=false;a.forEach(function(p){var t=resolve(p);if(!t||!t.dir)return print("rmdir: "+p+": No such directory","e");if(Object.keys(t.kids).length)return print("rmdir: "+p+": Directory not empty","e");if(t===home)return print("rmdir: refusing","e");delete t.parent.kids[t.name];ok=true});return ok};
C.fsck=function(){var r=fsck();print("** /dev/hole"+(hi+1)+"  ("+disp(home)+")","b");print("** Phase 1: Check root for loose inodes");print("** Phase 2: Check placement and duplicates");print("** Phase 3: Check directory shape and names");
  r.E.forEach(function(e){print("ERROR  "+e,"e")});r.W.forEach(function(w){print("warn   "+w,"d")});
  var health=Math.max(0,Math.round(100-r.E.length*100/Math.max(1,r.files)));print(r.files+" files, "+r.dirs+" directories, "+r.E.length+" errors, "+r.W.length+" warnings. inode health "+health+"%","b")};
C.hint=function(){var r=fsck();if(!r.E.length&&!r.W.length)return print("nothing to fix. go play the next hole.","d");
  var m=null;(function w(d){Object.keys(d.kids).forEach(function(nm){var c=d.kids[nm];if(m)return;if(c.dir)return w(c);if(c.meta.tags[0]==="junk"||(c.meta.dup&&/copy|\(1\)/.test(c.name)))m=["rm",c];else if(d===home||!placedOK(c))m=["mv",c]})})(home);
  if(!m)return print("hint: "+(r.E[0]||r.W[0]),"d");
  if(m[0]==="rm")print("hint: "+m[1].name+" is junk or a duplicate. rm it.","d");else print("hint: "+m[1].name+" wants a directory named like: "+m[1].meta.tags.slice(0,3).join(", "),"d")};
C.history=function(){if(!log.length)return print("(no strokes yet)","d");print("# move plan, hole "+(hi+1)+": "+HOLES[hi].t,"d");log.forEach(function(l){print(l)})};
C.reset=function(){build(hi);print("hole "+(hi+1)+" reset. strokes 0.","d");C.ls([])};
C.next=function(){if(hi>=HOLES.length-1)return print("no more holes. you are the filesystem now.","d");if(!done)print("skipping an unfinished hole. no score recorded.","d");hi++;start()};
C.cat=function(a){print("cat: "+(a[0]||"")+": binary or Google file. try file instead.","d")};
C.man=function(){print("No manual entry. Real hackers read the source. (try help)","d")};
C.exit=C.logout=function(){print("There is no escape from the filesystem.","d")};

function run(line){
  print("jason@pdp11:"+disp(cwd)+"$ "+line,"b");line=line.trim();if(!line)return;
  hist.push(line);hpos=hist.length;
  if(/^rm\s+-rf\s+\/\s*$/.test(line))return print("rm: nice try. the PDP-11 thanks you for your restraint.","e");
  var toks=tokenize(line);if(!toks.length)return;var name=toks[0].s,args=expand(toks.slice(1));
  var fn=C[name];if(!fn)return print(name+": command not found","e");
  var mut={mkdir:1,mv:1,rm:1,rmdir:1}[name],before=done;
  var ok=fn(args);
  if(mut&&ok!==false&&ok!==undefined){strokes++;log.push(line)}
  renderCard();if(mut)check();renderCard();
}
function start(){build(hi);out.textContent="";
  print("PDP-11/45 UNIX V7, fsgolf edition.  login: jason","b");print("Last login: Tue Oct  6 1979 on tty0","d");
  print("HOLE "+(hi+1)+" of "+HOLES.length+": "+HOLES[hi].t+"   PAR "+HOLES[hi].par,"b");
  print("Make fsck report 0 errors. Type help if lost.","d");print("");C.ls([]);renderCard();
}
// tab completion
function complete(){
  var v=cmd.value,m=v.match(/(\S*)$/),frag=m?m[1]:"",unq=frag.replace(/\\(.)/g,"$1").replace(/^['"]/,"");
  var sp=splitPath(unq),dir=resolve(sp[0]);if(!dir||!dir.dir)return;
  var c=Object.keys(dir.kids).filter(function(n){return n.indexOf(sp[1])===0});if(!c.length)return;
  var pick=c.length===1?c[0]:c.reduce(function(a,b){var i=0;while(i<a.length&&a[i]===b[i])i++;return a.slice(0,i)});
  if(c.length>1&&pick===sp[1]){print(c.join("   "),"d");return}
  var full=(sp[0]==="."&&unq.indexOf("./")!==0?"":sp[0].replace(/\/$/,"")+"/")+pick;
  var escd=full.replace(/([\s'"()&#$*?\[\]])/g,"\\$1")+(c.length===1&&dir.kids[pick].dir?"/":(c.length===1?" ":""));
  cmd.value=v.slice(0,v.length-frag.length)+escd;
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var l=cmd.value;cmd.value="";run(l)});
cmd.addEventListener('keydown',function(e){
  if(e.key==="Tab"){e.preventDefault();complete()}
  else if(e.key==="ArrowUp"){e.preventDefault();if(hpos>0){hpos--;cmd.value=hist[hpos]}}
  else if(e.key==="ArrowDown"){e.preventDefault();if(hpos<hist.length-1){hpos++;cmd.value=hist[hpos]}else{hpos=hist.length;cmd.value=""}}
  else if(e.key==="l"&&e.ctrlKey){e.preventDefault();C.clear()}
});
document.querySelectorAll('.keys button').forEach(function(b){b.addEventListener('click',function(){run(b.dataset.c);cmd.focus()})});
out.addEventListener('click',function(){if(!window.getSelection().toString())cmd.focus()});
start();
})();
</script>
