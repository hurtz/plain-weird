<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ff3fa6">
  <meta name="description" content="A catastrophically cute manga arcade shooter powered by heart bombs and uwu.">
  <title>UWU Sky♡Strike: I Love You!!</title>
  <style>
    :root {
      --font-geist-mono: "Arial Rounded MT Bold", "Courier New", monospace;
      --font-geist-sans: "Arial Rounded MT Bold", Arial, sans-serif;
    }
    :root {
  --ink: #101820;
  --cream: #f4e7c5;
  --red: #ff3e9d;
  --navy: #30125c;
  --cyan: #50f6ff;
  --yellow: #ffec55;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  color: var(--cream);
  background:
    radial-gradient(circle at 30% 0%, rgba(255, 39, 166, 0.22), transparent 36%),
    radial-gradient(circle at 80% 10%, rgba(47, 230, 255, 0.2), transparent 35%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 5px),
    #09051b;
  font-family: var(--font-geist-mono), "Courier New", monospace;
  overflow-x: hidden;
}

button {
  font: inherit;
}

.game-shell {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 18px;
  background:
    linear-gradient(rgba(17, 4, 38, .25), rgba(3, 14, 34, .48)),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.025) 3px 4px);
}

.cabinet {
  width: min(100%, 500px);
  position: relative;
  padding: 13px 13px 15px;
  border: 3px solid #071016;
  border-radius: 14px 14px 24px 24px;
  background:
    linear-gradient(90deg, rgba(255,255,255,.1), transparent 8% 92%, rgba(0,0,0,.28)),
    #36166d;
  box-shadow:
    0 0 0 2px #f24db8,
    0 0 0 7px #101026,
    0 0 44px rgba(63, 224, 255, .18),
    0 24px 70px rgba(0, 0, 0, .7);
}

.cabinet::before,
.cabinet::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 105px;
  bottom: 72px;
  width: 33px;
  background: #221047;
  border: 3px solid #09131a;
}

.cabinet::before {
  right: 100%;
  transform: skewY(-2deg);
  border-radius: 8px 0 0 16px;
}

.cabinet::after {
  left: 100%;
  transform: skewY(2deg);
  border-radius: 0 8px 16px 0;
}

.marquee {
  min-height: 70px;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 7px;
  padding: 10px 12px 8px;
  color: #fbefc9;
  background:
    linear-gradient(110deg, transparent 18%, rgba(255,255,255,.24) 32%, transparent 48%),
    linear-gradient(100deg, #f72192, #9225c7 58%, #276de9);
  border: 2px solid #4a176d;
  border-radius: 9px 9px 3px 3px;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.08), inset 0 -8px 20px rgba(64,13,16,.38);
  text-shadow: 3px 3px 0 #54166e;
  letter-spacing: -2px;
  transform: perspective(200px) rotateX(-2deg);
}

.marquee span {
  color: #5bf9ff;
  font-size: 13px;
  letter-spacing: 1px;
  writing-mode: vertical-rl;
}

.marquee strong {
  font-family: Impact, Haettenschweiler, sans-serif;
  font-size: clamp(28px, 7.5vw, 44px);
  line-height: 1;
  font-style: italic;
  letter-spacing: 2px;
}

.marquee b {
  max-width: 77px;
  color: #fff05a;
  font-size: 18px;
  line-height: .9;
  letter-spacing: -1px;
  transform: rotate(-5deg);
}

.hud {
  height: 48px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  padding: 3px 8px 1px;
  color: #fff4c9;
  background: #0b1720;
  border-left: 2px solid #061016;
  border-right: 2px solid #061016;
  font-variant-numeric: tabular-nums;
}

.hud > div {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.hud-center {
  text-align: center;
}

.hud .lives {
  text-align: right;
}

.hud-label {
  color: #ff61c5;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1.8px;
}

.hud strong {
  font-size: 15px;
  letter-spacing: 1px;
}

.lives strong {
  color: #5ef4ff;
  letter-spacing: 2px;
}

.screen-frame {
  position: relative;
  aspect-ratio: 384 / 672;
  overflow: hidden;
  border: 5px solid #081219;
  border-radius: 3px 3px 13px 13px;
  background: #32228d;
  box-shadow:
    inset 0 0 28px rgba(0,0,0,.5),
    0 2px 0 #9c6ddc,
    0 0 18px rgba(81,244,255,.22);
}

.screen-frame::after {
  content: "";
  pointer-events: none;
  position: absolute;
  inset: 0;
  z-index: 7;
  background:
    linear-gradient(90deg, rgba(255,255,255,.07), transparent 12% 88%, rgba(0,0,0,.14)),
    repeating-linear-gradient(0deg, rgba(2,10,13,.08) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 0 35px rgba(1, 15, 25, .36);
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  outline: none;
  image-rendering: pixelated;
}

.game-overlay {
  position: absolute;
  z-index: 5;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px;
  text-align: center;
  text-shadow: 2px 3px 0 rgba(9, 26, 35, .7);
}

.pilot-portrait {
  position: relative;
  width: 92px;
  height: 92px;
  margin-bottom: 14px;
  overflow: hidden;
  background: linear-gradient(145deg, #5ff8ff, #6242df 70%);
  border: 4px solid #fff171;
  border-radius: 50%;
  box-shadow: 0 0 0 4px #f93aab, 0 0 28px rgba(78,242,255,.65);
  transform: rotate(-4deg);
  text-shadow: none;
}

.pilot-face {
  position: absolute;
  top: 28px;
  left: 24px;
  width: 49px;
  height: 54px;
  background: #ffd5bf;
  border: 3px solid #5b2056;
  border-radius: 46% 46% 54% 50%;
}

.pilot-face i,
.pilot-face b {
  position: absolute;
  top: 23px;
  width: 11px;
  height: 13px;
  background: linear-gradient(#48f2ff 0 45%, #162e7c 48%);
  border: 2px solid #3b194e;
  border-radius: 50%;
}

.pilot-face i {
  left: 6px;
  transform: rotate(-8deg);
}

.pilot-face b {
  right: 6px;
  transform: rotate(8deg);
}

.pilot-hair {
  position: absolute;
  z-index: 2;
  top: 9px;
  left: 16px;
  width: 63px;
  height: 44px;
  background: #ffdb42;
  border: 3px solid #5d245a;
  border-radius: 55% 50% 30% 20%;
  transform: rotate(-6deg);
}

.pilot-hair::after {
  content: "";
  position: absolute;
  top: 22px;
  left: 7px;
  width: 46px;
  height: 25px;
  background: #ffdb42;
  clip-path: polygon(0 0, 22% 100%, 37% 15%, 55% 100%, 68% 10%, 100% 83%, 100% 0);
}

.pilot-scarf {
  position: absolute;
  z-index: 3;
  right: 7px;
  bottom: 2px;
  width: 37px;
  height: 15px;
  background: #ff337f;
  border: 2px solid #661e5d;
  transform: rotate(-18deg);
}

.sparkle {
  position: absolute;
  color: #fff46c;
  font-size: 27px;
  text-shadow: 0 0 8px #ff3eb5;
  animation: sparkle-pop 1.2s ease-in-out infinite alternate;
}

.sparkle-one {
  top: 21%;
  left: 18%;
}

.sparkle-two {
  top: 30%;
  right: 17%;
  color: #5ff8ff;
  animation-delay: -.6s;
}

.eyebrow {
  margin: 0 0 7px;
  color: #63f4ff;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 4px;
}

.game-overlay h1 {
  max-width: 335px;
  margin: 0;
  color: #fff7d6;
  font-family: Impact, Haettenschweiler, sans-serif;
  font-size: clamp(39px, 11vw, 60px);
  font-style: italic;
  font-weight: 900;
  line-height: .9;
  letter-spacing: 2px;
  text-shadow: 3px 3px 0 #ff3aab, 6px 6px 0 #5422a4, 9px 9px 0 rgba(3, 19, 31, .65);
  transform: skewY(-3deg);
}

.mission {
  max-width: 285px;
  margin: 22px 0 21px;
  color: #fff9dc;
  font-family: var(--font-geist-sans), sans-serif;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.45;
}

.final-score {
  margin: 23px 0 20px;
  color: #f5d35c;
  font-size: 12px;
  letter-spacing: 2px;
}

.final-score strong {
  color: #fff3cf;
  font-size: 27px;
}

.start-button {
  min-width: 205px;
  padding: 14px 20px;
  color: #fff4cd;
  background: linear-gradient(90deg, #ef2d9a, #7b36db);
  border: 2px solid #58f4ff;
  border-radius: 3px;
  box-shadow: 0 4px 0 #401d72, 0 0 0 4px rgba(255, 234, 83, .38), 0 0 24px rgba(79,240,255,.35);
  font-size: 14px;
  font-weight: 950;
  letter-spacing: 1.6px;
  cursor: pointer;
}

.start-button:hover {
  filter: brightness(1.12);
  transform: translateY(-1px);
}

.start-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #681f25, 0 0 0 4px rgba(8, 31, 45, .5);
}

.coin {
  margin-top: 20px;
  color: #fff4c2;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1.5px;
  animation: blink 1.15s steps(1) infinite;
}

.mission-tag {
  position: absolute;
  z-index: 3;
  top: 12px;
  left: 50%;
  padding: 5px 9px;
  color: #fff272;
  background: rgba(50, 12, 103, .72);
  border: 1px solid rgba(94,245,255,.58);
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 1.2px;
  transform: translateX(-50%);
  white-space: nowrap;
  animation: mission-fade 4s forwards;
}

.combo-meter {
  position: absolute;
  z-index: 4;
  top: 56px;
  right: 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  color: #fff15e;
  font-style: italic;
  filter: drop-shadow(3px 3px 0 #8a207b);
  transform: rotate(3deg);
  pointer-events: none;
}

.combo-meter b {
  font-family: Impact, Haettenschweiler, sans-serif;
  font-size: 42px;
  line-height: .8;
}

.combo-meter span {
  color: #69f7ff;
  font-size: 8px;
  font-weight: 950;
  letter-spacing: 1px;
}

.attack-callout {
  position: absolute;
  z-index: 6;
  top: 42%;
  left: -4%;
  width: 108%;
  padding: 13px 10px;
  color: #fff974;
  background: linear-gradient(90deg, transparent, rgba(209,31,143,.84) 15% 85%, transparent);
  font-family: Impact, Haettenschweiler, sans-serif;
  font-size: clamp(23px, 7vw, 35px);
  font-style: italic;
  line-height: 1;
  letter-spacing: 1px;
  text-align: center;
  text-shadow: 3px 3px 0 #46115d, 0 0 12px #ff5fcb;
  transform: rotate(-4deg) skewX(-8deg);
  animation: attack-smash 1.35s ease-out both;
  pointer-events: none;
}

.controls {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 15px;
  align-items: center;
  min-height: 79px;
  padding: 12px 14px 8px;
  color: #12212a;
  background:
    linear-gradient(rgba(255,255,255,.12), transparent 45%),
    #b9a4dc;
  border: 3px solid #0a141a;
  border-top: 1px solid #67747a;
  border-radius: 3px 3px 14px 14px;
  box-shadow: inset 0 -8px 17px rgba(83,65,44,.25);
}

.control-copy {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.control-copy strong {
  color: #c61f8c;
  font-size: 12px;
  letter-spacing: 2px;
}

.control-copy span {
  max-width: 130px;
  font-size: 8px;
  font-weight: 800;
  line-height: 1.4;
}

.round-button {
  width: 57px;
  height: 57px;
  display: grid;
  place-items: center;
  padding: 0;
  color: #fff2c9;
  background: #ef2995;
  border: 4px solid #7d1c78;
  border-radius: 50%;
  box-shadow: inset 0 4px 3px rgba(255,255,255,.2), 0 4px 0 #17242b;
  font-size: 9px;
  font-weight: 950;
  letter-spacing: .5px;
  cursor: pointer;
  user-select: none;
}

.round-button:active {
  transform: translateY(3px);
  box-shadow: inset 0 3px 5px rgba(0,0,0,.2), 0 1px 0 #17242b;
}

.roll-button {
  width: 52px;
  height: 52px;
  color: #17232a;
  background: #f2d838;
  border-color: #8d6b1d;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.roll-button b {
  font-size: 12px;
}

.fire-button {
  width: 63px;
  height: 63px;
  font-size: 11px;
  box-shadow: inset 0 4px 3px rgba(255,255,255,.28), 0 4px 0 #17242b, 0 0 17px #ff37af;
}

.hint {
  margin: 10px 0 0;
  color: #9babb3;
  font-size: 8px;
  text-align: center;
  letter-spacing: .5px;
}

kbd {
  color: #f1d98b;
  font: inherit;
}

@keyframes blink {
  50% { opacity: .25; }
}

@keyframes mission-fade {
  0%, 68% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes sparkle-pop {
  from { transform: scale(.65) rotate(-15deg); opacity: .55; }
  to { transform: scale(1.25) rotate(12deg); opacity: 1; }
}

@keyframes attack-smash {
  0% { opacity: 0; transform: translateX(-70%) rotate(-9deg) skewX(-8deg) scale(1.8); }
  16% { opacity: 1; transform: translateX(0) rotate(-4deg) skewX(-8deg) scale(1); }
  76% { opacity: 1; }
  100% { opacity: 0; transform: translateX(12%) rotate(-2deg) skewX(-8deg) scale(1.1); }
}

.cabinet::before,
.cabinet::after {

}

.cabinet-sticker {

  border-radius: 46% 54% 48% 52%;

  letter-spacing: 1px;

}

.sticker-left {

}

.sticker-right {

.marquee {

.marquee::before,
.marquee::after {

.marquee span {

}

.marquee strong {

.marquee b {

.hud {

.pilot-portrait::before,

}

.pilot-portrait::before {

.pilot-hair,

}

.mission {

.start-button {
  color: #7b1e69;

    radial-gradient(circle at 8px 8px, rgba(255,255,255,.55) 0 2px, transparent 2.5px),

.manga-bubble {
  position: absolute;
  z-index: -1;
  padding: 8px 10px;
  color: #6e1a65;
  background: #fff;
  border: 3px solid #6e1a65;
  border-radius: 50%;
  font-family: Impact, Haettenschweiler, sans-serif;
  font-size: 12px;
  line-height: 1;
  text-shadow: none;
  box-shadow: 3px 3px 0 #ffef64;
}

.manga-bubble::after {
  content: "";
  position: absolute;
  bottom: -10px;
  width: 14px;
  height: 14px;
  background: #fff;
  border-right: 3px solid #6e1a65;
  border-bottom: 3px solid #6e1a65;
  transform: rotate(45deg);
}

.bubble-left {
  top: 23%;
  left: 7%;
  transform: rotate(-10deg);
}

.bubble-left::after {
  right: 5px;
}

.bubble-right {
  top: 16%;
  right: 6%;
  transform: rotate(9deg);
}

.bubble-right::after {
  left: 7px;
}

.mission-tag {
  color: #792060;
  background: rgba(255, 247, 253, .9);
  border: 2px solid #f337a2;
  border-radius: 999px;
  box-shadow: 2px 3px 0 #fff35f;
}

.manga-sfx {
  position: absolute;
  z-index: 3;
  color: rgba(255,255,255,.82);
  font-family: Impact, Haettenschweiler, sans-serif;
  font-size: 32px;
  font-style: italic;
  text-shadow: 3px 3px 0 #c42a8b;
  pointer-events: none;
  animation: sfx-pulse .55s steps(2) infinite alternate;
}

.manga-sfx-left {
  top: 24%;
  left: 7px;
  transform: rotate(-16deg);
}

.manga-sfx-right {
  right: 7px;
  bottom: 25%;
  transform: rotate(13deg);
}

.combo-meter {
  color: #fff;
  filter: drop-shadow(3px 3px 0 #e72b9c) drop-shadow(2px 2px 0 #fff256);
}

.combo-meter span {
  color: #fff45d;
  background: #e92f9e;
  padding: 3px 5px;
  border: 1px solid #fff;
}

.attack-callout {
  color: #fff;
  background:
    radial-gradient(circle at 8px 8px, rgba(255,255,255,.32) 0 2px, transparent 2.5px),
    linear-gradient(90deg, transparent, rgba(247,39,155,.94) 12% 88%, transparent);
  background-size: 16px 16px, auto;
  border-block: 3px solid #fff05d;
  text-shadow: 3px 3px 0 #7b1f6e, 5px 5px 0 #ffed57;
}

.controls {
  color: #702064;
  background:
    radial-gradient(circle at 7px 7px, rgba(242,49,155,.23) 0 2px, transparent 2.6px),
    linear-gradient(#fff7fc, #ffbfe3);
  background-size: 15px 15px, auto;
  border-color: #752066;
  box-shadow: inset 0 -8px 17px rgba(176,35,127,.22);
}

.control-copy strong {
  color: #e32293;
}

.round-button {
  color: #fff;
  background: linear-gradient(145deg, #ff84c8, #e52b96);
  border-color: #fff;
  box-shadow: inset 0 4px 3px rgba(255,255,255,.35), 0 4px 0 #7c216d, 0 0 0 3px #f638a0;
}

.roll-button {
  color: #751f67;
  background: linear-gradient(145deg, #fff876, #ffadd9);
  border-color: #fff;
  box-shadow: inset 0 4px 3px rgba(255,255,255,.5), 0 4px 0 #8d296f, 0 0 0 3px #f638a0;
}

.fire-button {
  box-shadow:
    inset 0 4px 3px rgba(255,255,255,.35),
    0 4px 0 #7c216d,
    0 0 0 3px #fff468,
    0 0 24px #ff37af;
}

.hint {
  color: #fff;
  text-shadow: 1px 1px 0 #7e266d;
}

kbd {
  color: #fff569;
}

@keyframes sticker-wiggle {
  from { transform: rotate(-10deg) scale(.9); }
  to { transform: rotate(9deg) scale(1.15); }
}

@keyframes pilot-bob {
  from { transform: translateY(-3px) rotate(-5deg); }
  to { transform: translateY(4px) rotate(4deg); }
}

@keyframes love-pulse {
  from { transform: scale(.98); filter: saturate(.95); }
  to { transform: scale(1.04); filter: saturate(1.25) brightness(1.05); }
}

@keyframes sfx-pulse {
  from { opacity: .38; letter-spacing: -2px; }
  to { opacity: .9; letter-spacing: 2px; }
}

@media (min-width: 740px) and (min-height: 830px) {
  .cabinet {
    width: 520px;
  }
}

@media (max-height: 820px) {
  .game-shell {
    padding: 8px;
  }

  .cabinet {
    width: min(100%, 390px);
    padding: 8px;
  }

  .marquee {
    min-height: 47px;
    padding: 5px;
  }

  .marquee strong {
    font-size: 35px;
  }

  .marquee span {
    font-size: 16px;
  }

  .marquee b {
    font-size: 22px;
  }

  .hud {
    height: 38px;
  }

  .controls {
    min-height: 55px;
    padding: 6px 12px 4px;
  }

  .round-button {
    width: 43px;
    height: 43px;
    border-width: 3px;
  }

  .fire-button {
    width: 49px;
    height: 49px;
  }

  .hint {
    display: none;
  }
}

@media (max-width: 520px) {
  .game-shell {
    align-items: start;
    padding: 0;
    background: #0a141b;
  }

  .cabinet {
    width: 100%;
    min-height: 100dvh;
    padding: 7px;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .cabinet::before,
  .cabinet::after {
    display: none;
  }

  .screen-frame {
    max-height: calc(100dvh - 178px);
    margin-inline: auto;
  }

  .marquee {
    min-height: 48px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .coin,
  .mission-tag {
    animation: none;
  }
}
