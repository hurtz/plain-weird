<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sir Tinpot and the Wax Baron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e6d8c2;--cab1:#7a5139;--cab2:#4d3122;--plate:#24160f;--ink:#f6e8cc;--muted:#e2c9a2;--btn1:#5b3d2e;--btn2:#3a261c;--shadow:rgba(40,20,10,.45);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0b0706;--cab1:#3b291f;--cab2:#1f140e;--plate:#120b07;--shadow:rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--page:#0b0706;--cab1:#3b291f;--cab2:#1f140e;--plate:#120b07;--shadow:rgba(0,0,0,.7)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);display:flex;justify-content:center;align-items:flex-start;font-family:"Press Start 2P",ui-monospace,monospace;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#cab{width:100%;max-width:min(760px,max(320px,calc((100dvh - 210px) * 4 / 3 + 40px)));margin:10px auto;padding:12px 12px 14px;border-radius:20px;background:linear-gradient(160deg,var(--cab1),var(--cab2));box-shadow:0 10px 30px var(--shadow),inset 0 1px 0 rgba(255,255,255,.12)}
#bezel{background:#050303;border-radius:16px;padding:9px;box-shadow:inset 0 0 0 2px #000,inset 0 0 26px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.08)}
#scr{display:block;width:100%;height:auto;aspect-ratio:4/3;border-radius:14px/18px;background:#000;touch-action:none}
#ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px 0}
#dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:5px;flex:none}
.u{grid-area:1/2}.l{grid-area:2/1}.r{grid-area:2/3}.d{grid-area:3/2}
button{appearance:none;-webkit-appearance:none;border:0;padding:0;margin:0;border-radius:12px;background:radial-gradient(circle at 35% 30%,var(--btn1),var(--btn2));box-shadow:0 5px 0 #120a06,inset 0 1px 0 rgba(255,255,255,.15);color:var(--ink);touch-action:none;cursor:pointer;display:grid;place-items:center;transition:transform .05s}
button:focus-visible{outline:2px solid #ffcf6a;outline-offset:2px}
button.on{transform:translateY(4px);box-shadow:0 1px 0 #120a06,inset 0 1px 0 rgba(255,255,255,.1)}
button svg{width:18px;height:18px;fill:#f2d9a8}
#plate{flex:1;min-width:0;text-align:center;font-size:7px;line-height:1.9;color:var(--muted);background:var(--plate);border-radius:8px;padding:8px 6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#plate b{display:block;color:#ffcf6a;font-size:8px;margin-bottom:4px}
#sword{width:92px;height:92px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b52,#9e1b12);box-shadow:0 6px 0 #4a0b06,inset 0 2px 0 rgba(255,255,255,.25);font-family:inherit;font-size:9px;color:#fff3dc}
#sword.on{box-shadow:0 1px 0 #4a0b06}
@media (max-width:380px){#dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}#sword{width:80px;height:80px}#plate{font-size:6px}}
</style>
</head>
<body>
<div id="cab">
  <div id="bezel"><canvas id="scr" width="640" height="480" aria-label="Game screen"></canvas></div>
  <div id="ctrl">
    <div id="dpad">
      <button class="u" data-k="up" aria-label="Up"><svg viewBox="0 0 10 10"><polygon points="5,1 9,8 1,8"/></svg></button>
      <button class="l" data-k="left" aria-label="Left"><svg viewBox="0 0 10 10"><polygon points="1,5 8,1 8,9"/></svg></button>
      <button class="r" data-k="right" aria-label="Right"><svg viewBox="0 0 10 10"><polygon points="9,5 2,1 2,9"/></svg></button>
      <button class="d" data-k="down" aria-label="Down"><svg viewBox="0 0 10 10"><polygon points="5,9 1,2 9,2"/></svg></button>
    </div>
    <div id="plate"><b>TINPOT LASER THEATER</b>WATCH FOR THE FLASH<br>THEN MOVE<br>SWIPE OR TAP SCREEN TOO</div>
    <button id="sword" data-k="sword" aria-label="Sword">SWORD</button>
  </div>
</div>
<script>
(()=>{'use strict';
const TAU=Math.PI*2,LW=320,LH=240,INK='#160c0a';
const F6='6px "Press Start 2P", ui-monospace, monospace',F8='8px "Press Start 2P", ui-monospace, monospace';
const CZ=s=>`900 ${s}px Cinzel, Georgia, serif`;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>{t=clamp(t);return t*t*(3-2*t)};
function rnd(seed){let s=Math.imul(seed,2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function hsh(n){n=Math.imul(n|0,374761393);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function mk(w,h){const k=document.createElement('canvas');k.width=w;k.height=h;return k}

/* ---------- screens and the washed laserdisc look ---------- */
const out=document.getElementById('scr'),oc=out.getContext('2d');
const low=mk(LW,LH),c=low.getContext('2d',{willReadFrequently:true});
const post=mk(LW,LH),pc=post.getContext('2d');
const tiny=mk(80,60),tc=tiny.getContext('2d');
const OUTD=pc.createImageData(LW,LH);
const scan=mk(640,480);{const s=scan.getContext('2d');s.fillStyle='rgba(0,0,0,.26)';for(let y=1;y<480;y+=2)s.fillRect(0,y,640,1)}
const vig=mk(640,480);{const s=vig.getContext('2d');const g=s.createRadialGradient(320,240,150,320,240,430);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.78)');s.fillStyle=g;s.fillRect(0,0,640,480)}
const NOISE=new Float32Array(65536);for(let i=0;i<65536;i++)NOISE[i]=Math.random()-.5;
let G=0;const trk={y:999,h:0};let scratch={x:0,until:0};

function postFX(){
  const s=c.getImageData(0,0,LW,LH).data,d=OUTD.data;let ni=(Math.random()*65536)|0;
  const wob=Math.sin(G*1.3)*.6;
  for(let y=0;y<LH;y++){
    let ox=Math.round(Math.sin(y*.09+G*7)*.45+wob*Math.sin(y*.02)),br=0;
    if(y>trk.y&&y<trk.y+trk.h){ox+=3+((Math.random()*3)|0);br=36}
    const row=y*LW;
    for(let x=0;x<LW;x++){
      let xg=x+ox;xg=xg<0?0:(xg>=LW?LW-1:xg);
      const xr=xg+1<LW?xg+1:xg,xb=xg>0?xg-1:xg;
      let r=s[(row+xr)<<2],g=s[((row+xg)<<2)+1],b=s[((row+xb)<<2)+2];
      const l=r*.3+g*.59+b*.11;r=l+(r-l)*.8;g=l+(g-l)*.8;b=l+(b-l)*.8;
      const n=NOISE[(ni++)&65535]*24,i=(row+x)<<2;
      d[i]=18+r*.88+n+br;d[i+1]=14+g*.85+n+br;d[i+2]=20+b*.78+n+br;d[i+3]=255;
    }
  }
  pc.putImageData(OUTD,0,0);
}
function present(){
  postFX();
  oc.globalCompositeOperation='source-over';oc.globalAlpha=1;oc.imageSmoothingEnabled=true;
  oc.fillStyle='#000';oc.fillRect(0,0,640,480);
  oc.drawImage(post,0,Math.random()<.04?2:0,640,480);
  tc.clearRect(0,0,80,60);tc.drawImage(post,0,0,80,60);
  oc.globalCompositeOperation='screen';oc.globalAlpha=.32;oc.drawImage(tiny,0,0,640,480);
  oc.globalAlpha=1;oc.globalCompositeOperation='source-over';
  oc.drawImage(scan,0,0);oc.drawImage(vig,0,0);
  oc.fillStyle=`rgba(0,0,0,${Math.random()*.06})`;oc.fillRect(0,0,640,480);
}
function dirt(){
  if(Math.random()<.35){const n=1+((Math.random()*3)|0);for(let i=0;i<n;i++){c.fillStyle=Math.random()<.5?'rgba(0,0,0,.7)':'rgba(255,250,235,.6)';const s=Math.random()*1.8+.5;E(Math.random()*LW,Math.random()*LH,s,s*(.5+Math.random()));c.fill()}}
  if(G>scratch.until&&Math.random()<.006)scratch={x:Math.random()*LW,until:G+.3+Math.random()*.6};
  if(G<scratch.until){c.fillStyle='rgba(255,250,235,.35)';c.fillRect(scratch.x+Math.sin(G*40),0,.8,LH)}
}

/* ---------- drawing helpers ---------- */
const P=()=>c.beginPath();
function F(fill,lw=1.4){if(fill){c.fillStyle=fill;c.fill()}c.lineWidth=lw;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';c.stroke()}
function E(x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU)}
function RR(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function glow(x,y,r,col,a=1){if(r<1)return;c.save();c.globalCompositeOperation='lighter';c.globalAlpha*=a;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore()}
function lgrad(x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,col])=>g.addColorStop(o,col));return g}
const gold=(a,b)=>lgrad(0,a,0,b,[[0,'#fff1a0'],[.5,'#ffb83a'],[1,'#d2541c']]);
const red=(a,b)=>lgrad(0,a,0,b,[[0,'#ffb08a'],[.5,'#ff4a2a'],[1,'#8a1208']]);
function txt(s,x,y,font,col,stroke=0,align='center'){c.font=font;c.textAlign=align;c.textBaseline='middle';if(stroke){c.lineWidth=stroke;c.strokeStyle=INK;c.lineJoin='round';c.strokeText(s,x,y)}c.fillStyle=col;c.fillText(s,x,y)}
function path(t,pts){if(t<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++)if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];return lerp(a[1],b[1],ease((t-a[0])/(b[0]-a[0])))}return pts[pts.length-1][1]}
function walker(t,pts,y){const x=path(t,pts),v=(path(t+.03,pts)-x)/.03;return{x,y,run:x*.32,stride:clamp(Math.abs(v)/45),face:v<-8?-1:1}}
const pad=n=>String(n).padStart(6,'0');
function flame(x,y,h,seed=0){
  const f=Math.sin(G*19+seed)*.14+Math.sin(G*11.3+seed*1.7)*.1,sw=Math.sin(G*7+seed)*h*.12;
  c.save();c.translate(x,y);
  [[1,'#e8661c'],[.7,'#f6b23c'],[.4,'#fff1a8']].forEach(([k,col])=>{const H=h*k*(1+f),W=h*.42*k;P();c.moveTo(sw*k,-H);c.bezierCurveTo(W,-H*.45,W,0,0,0);c.bezierCurveTo(-W,0,-W,-H*.45,sw*k,-H);c.fillStyle=col;c.fill()});
  c.restore();glow(x,y-h*.35,h*2,'rgba(255,150,60,0.5)');
}
function bricks(x0,y0,w,h,bw,bh,c1,c2,seed){
  c.fillStyle=c1;c.fillRect(x0,y0,w,h);const R=rnd(seed);
  for(let y=y0,r=0;y<y0+h;y+=bh,r++){
    for(let x=x0-(r%2)*bw/2;x<x0+w;x+=bw){const v=R();if(v<.35){c.fillStyle=v<.15?'rgba(0,0,0,.18)':'rgba(255,255,255,.05)';c.fillRect(x+1,y+1,bw-2,bh-2)}c.fillStyle=c2;c.fillRect(x,y,1,bh)}
    c.fillStyle=c2;c.fillRect(x0,y,w,1);
  }
}
function star(x,y,r){P();for(let i=0;i<10;i++){const a=i/10*TAU-Math.PI/2,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();F('#ffe066',.8)}
function gem(x,y,sc=1){
  if(sc<.02)return;glow(x,y,30*sc,'rgba(255,220,90,0.6)');
  c.save();c.translate(x,y);c.scale(sc,sc);
  for(let i=0;i<8;i++){const a=i/8*TAU+G*.6,L=18+3*Math.sin(G*4+i);c.strokeStyle='rgba(255,236,150,.5)';c.lineWidth=1.2;P();c.moveTo(Math.cos(a)*9,Math.sin(a)*9);c.lineTo(Math.cos(a)*L,Math.sin(a)*L);c.stroke()}
  P();c.moveTo(0,-8);c.lineTo(7,-2);c.lineTo(4,7);c.lineTo(-4,7);c.lineTo(-7,-2);c.closePath();F('#ffcf3a',1.2);
  P();c.moveTo(0,-8);c.lineTo(2.5,-2);c.lineTo(0,7);c.lineTo(-2.5,-2);c.closePath();c.fillStyle='#fff3b0';c.fill();
  c.restore();
}

/* ---------- Sir Tinpot ---------- */
function leg(hx,hy,ang,sq,col,ch){c.save();c.translate(hx,hy);c.rotate(ang);c.scale(1,sq);RR(-2.4,-1,4.8,12.5,2);F(col,1.1);RR(-2.6,10.4,7.6,3.8,1.6);F(ch?'#100d0d':'#4b2d1c',1.1);c.restore()}
function hero(p){
  const s=p.s||1,duck=p.duck||0,jump=p.jump||0,ch=!!p.char,stride=p.stride==null?1:p.stride;
  c.save();c.globalAlpha*=p.alpha==null?1:clamp(p.alpha);
  c.translate(p.x,p.y);c.rotate(p.rot||0);c.scale(s*(p.face||1),s);
  if(p.hang)c.translate(-4,37);
  const sq=1-duck*.4,a=Math.sin(p.run||0)*.8*stride*(1-jump);
  const A1=ch?'#1b1818':'#a9b3ba',A2=ch?'#131010':'#86929b';
  leg(3,-13*sq,-a-jump*.5,sq,A2,ch);
  leg(-3,-13*sq,a+jump*.75,sq,A1,ch);
  c.save();c.translate(0,-20*sq);
  E(0,0,8.5,10*sq);F(A1);
  if(!ch){E(-2.8,-3*sq,2.3,4*sq);c.fillStyle='#eef2f3';c.fill()}
  P();c.moveTo(-5.5,-6*sq);c.lineTo(5.5,-6*sq);c.lineTo(5,8*sq);c.lineTo(0,5*sq);c.lineTo(-5,8*sq);c.closePath();F(ch?'#0e0c0c':'#b5352b',1.1);
  if(!ch){E(0,0,1.8,1.8);c.fillStyle='#f2c74a';c.fill()}
  c.save();c.translate(0,-14*sq);
  const pw=Math.sin(G*7+(p.run||0)*.5)*1.6;
  P();c.moveTo(-1,-8);c.bezierCurveTo(-3,-19,8+pw,-21,13+pw,-12);c.bezierCurveTo(9,-13,6,-11,3,-8);c.closePath();F(ch?'#241f1f':'#ef8a2b',1.1);
  RR(-6.5,-8,13,13,3);F(ch?'#191515':'#8e99a2');
  c.fillStyle=INK;c.fillRect(-5,-3,10,2.2);
  if(!ch){c.fillStyle='#dde4e8';c.fillRect(-5,-6.5,1.8,8)}
  if(p.eyes&&((G*3)|0)%5){c.fillStyle='#fff';c.fillRect(-3.5,-2.7,1.5,1.5);c.fillRect(1.6,-2.7,1.5,1.5)}
  c.restore();
  let arm=p.arm==null?-.35:p.arm,blade=p.blade==null?-2:p.blade;
  if(p.sw!=null){arm=lerp(2.6,-.9,ease(p.sw));blade=-.35}
  c.save();c.translate(4.5,-5*sq);c.rotate(arm);
  RR(-2.2,0,4.4,10,2);F(A2,1.1);c.translate(0,10);
  if(!p.noSword){c.save();c.rotate(blade);P();c.moveTo(-1.6,3);c.lineTo(1.6,3);c.lineTo(1.2,21);c.lineTo(0,24);c.lineTo(-1.2,21);c.closePath();F(ch?'#2a2626':'#eef3f6',1);RR(-4.5,.6,9,2.4,1);F(ch?'#1d1a1a':'#d6a636',1);c.restore()}
  if(p.gem){c.save();c.translate(0,7);c.rotate(-arm-(p.rot||0));gem(0,0,.75);c.restore()}
  E(0,0,2.4,2.4);F(ch?'#1a1616':'#7a5a3e',1);
  c.restore();
  if(p.sw!=null&&p.sw>.12&&p.sw<.95){c.save();c.translate(4.5,-5*sq);c.globalAlpha*=.75;c.strokeStyle='#fff6d8';c.lineWidth=2.5;P();c.arc(0,0,31,-2.4,lerp(-2.4,.35,p.sw));c.stroke();c.restore()}
  c.restore();
  c.restore();
}
function skeleton(p){
  c.save();c.translate(p.x,p.y);c.rotate(p.rot||0);const s=p.s||1;c.scale(s*(p.face||1),s);if(p.hang)c.translate(-4,37);
  const col='#fff4d6';c.strokeStyle=col;c.fillStyle=col;c.lineCap='round';c.lineWidth=2.2;
  const L=(a,b,d,e)=>{P();c.moveTo(a,b);c.lineTo(d,e);c.stroke()};
  L(-3,-13,-4,-1);L(3,-13,4,-1);L(-4,-1,-1,-1);L(4,-1,7,-1);L(0,-13,0,-31);
  E(0,-13,4.5,2);c.fill();
  c.lineWidth=1.4;for(let i=0;i<4;i++){E(0,-27+i*3.4,6-i*.7,1.5);c.stroke()}
  c.lineWidth=2;L(-1,-28,-6,-17);L(3,-28,10,-21);L(10,-21,14,-28);
  E(0,-38,6,6.4);c.fill();c.fillStyle='#000';E(-2.3,-38.6,1.7,2.1);c.fill();E(2.3,-38.6,1.7,2.1);c.fill();c.fillRect(-2.2,-33.6,4.4,1.1);
  c.restore();
}
function helmetIcon(x,y){P();c.moveTo(x-1,y-7);c.quadraticCurveTo(x+5,y-14,x+10,y-6);c.lineTo(x+3,y-7);c.closePath();F('#ef8a2b',1);RR(x-6,y-7,12,12,3);F('#8e99a2',1.2);c.fillStyle=INK;c.fillRect(x-4.5,y-2,9,2)}

/* ---------- deaths ---------- */
function skelDeath(p,d,sc){
  if(d<1.3){
    if(((d*14)|0)%2===0){c.fillStyle='rgba(0,0,0,.9)';c.fillRect(0,0,LW,LH);skeleton(p)}
    else{c.fillStyle='rgba(255,236,190,.22)';c.fillRect(0,0,LW,LH);hero({...p,char:true})}
    return;
  }
  const gy=sc.ground,x=p.x;c.strokeStyle='#efe6cc';c.lineWidth=2;c.lineCap='round';
  [[-9,-2,-1,-3],[2,-1,10,-3],[-5,-5,3,-1],[-12,-1,-6,-6]].forEach(([a,b,q,e])=>{P();c.moveTo(x+a,gy+b);c.lineTo(x+q,gy+e);c.stroke()});
  E(x+4,gy-6,5,5);c.fillStyle='#efe6cc';c.fill();c.fillStyle='#000';E(x+2.5,gy-6.5,1.2,1.5);c.fill();E(x+5.5,gy-6.5,1.2,1.5);c.fill();
  const u=Math.min(d-1.3,1);c.save();c.translate(x-6-u*24,gy-6);c.rotate(-u*6);RR(-6.5,-6.5,13,13,3);F('#8e99a2',1.2);c.fillStyle=INK;c.fillRect(-5,-1,10,2);c.restore();
}
function burnDeath(p,d,sc){
  const gy=sc.ground,q={...p,y:gy,jump:0,rot:0,hang:false,sw:null,stride:0,noSword:false,gem:false};
  if(d<.45){hero(q);for(let i=0;i<7;i++)flame(q.x-9+i*3,gy-4-(i%3)*10,9+(i%2)*5,i*1.9);return}
  if(d<1.4){
    hero({...q,char:true,eyes:true});
    for(let i=0;i<4;i++){const k=((d-.45)*.9+i*.25)%1;c.fillStyle=`rgba(90,85,90,${.6*(1-k)})`;E(q.x+Math.sin(i*3+d*2)*6,gy-40-k*40,4+k*8,4+k*6);c.fill()}
    if(d<.8)for(let i=0;i<4;i++)flame(q.x-6+i*4,gy-2,5*(1-(d-.45)/.35),i);
    return;
  }
  const k=ease((d-1.4)/.45);

  for(let i=0;i<6;i++){const s=1.5+1.5*Math.abs(Math.sin(T*3+i));star(160+Math.sin(T*1.3+i*2)*70,100+Math.cos(T*1.1+i)*45,s)}
  txt('THE END',160,30,CZ(26),gold(18,42),4);
  txt('THE SUNSTONE IS HOME',160,54,F6,'#ffe9b0',2);
  txt('SCORE '+pad(score),160,216,F8,'#ffffff',2);
  if(T>2&&((G*2)|0)%2===0)txt('PRESS SWORD TO PLAY AGAIN',160,232,F6,'#ffd27a',2);
}

/* ---------- sound ---------- */
let AC=null,master=null;
function au(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type='square',v=.1,f2=0,at=0){if(!AC)return;const t0=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.05)}
function hiss(d,v=.1,fq=1200,at=0,type='lowpass'){if(!AC)return;const t0=AC.currentTime+at,n=(AC.sampleRate*d)|0,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fq;const g=AC.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(master);s.start(t0)}
const sfx={
  cue(){tone(1320,.07,'square',.05)},
  good(){tone(784,.08,'square',.07);tone(1175,.14,'square',.07,0,.07)},
  die(k){if(k==='fall'){tone(900,1.0,'triangle',.12,120);hiss(.5,.2,700,.9)}else if(k==='burn'){hiss(1.2,.25,900);tone(200,.8,'sawtooth',.06,60)}else if(k==='eaten'){tone(140,.5,'sawtooth',.1,60);tone(90,.3,'square',.08,50,.6)}else if(k==='squash'){hiss(.25,.35,500,.15);tone(70,.4,'square',.12,40,.15)}else{for(let i=0;i<8;i++)tone(i%2?220:330,.07,'square',.08,0,i*.14)}},
  seek(){hiss(.9,.05,2500,0,'bandpass');tone(48,.9,'sine',.06)},
  start(){[392,523,659,784].forEach((f,i)=>tone(f,.15,'square',.07,0,i*.11))},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'square',.07,0,i*.16))}
};

/* ---------- game state ---------- */
let state='title',si=0,st=0,mi=0,ts=1,score=0,lives=3,dead=null,seekT=0,seekNext=0,overT=0,endT=0,hi=0;
try{hi=+localStorage.getItem('tinpot-hi')||0}catch(e){}
function saveHi(){if(score>hi){hi=score;try{localStorage.setItem('tinpot-hi',String(hi))}catch(e){}}}
function startScene(i){si=i;st=0;mi=0;ts=1;SC[i].moves.forEach(m=>{m.open=false;m.done=false});state='play'}
function seek(n){state='seek';seekT=0;seekNext=n;sfx.seek()}
function die(){const S=SC[si],m=S.moves[mi];dead={m,mi,failT:st,dk:0,pose:S.hero(st)};state='death';sfx.die(m.death)}
function press(k){
  au();
  if(state==='title'){if(k==='sword'){score=0;lives=3;sfx.start();seek(0)}return}
  if(state==='over'){if(k==='sword'){score=0;lives=3;sfx.start();seek(si)}return}
  if(state==='end'){if(k==='sword'&&endT>2)state='title';return}
  if(state!=='play')return;
  const m=SC[si].moves[mi];if(!m||!m.open||m.done)return;
  if(k===m.key){m.done=true;ts=4;score+=379+si*121;sfx.good()}else die();
}
function update(dt){
  if(state==='play'){
    const S=SC[si];st+=dt*ts;const m=S.moves[mi];
    if(m){
      if(!m.open&&st>=m.at){m.open=true;sfx.cue()}
      if(m.open){if(m.done){if(st>=m.at+m.win){ts=1;mi++}}else if(st>=m.at+m.win)die()}
    }else if(st>=S.len){if(si<SC.length-1)seek(si+1);else{score+=1000*lives;state='end';endT=0;saveHi();sfx.win()}}
  }else if(state==='death'){dead.dk+=dt;if(dead.dk>2.4){lives--;if(lives>0)seek(si);else{state='over';overT=0;saveHi()}}}
  else if(state==='seek'){seekT+=dt;if(seekT>1.1)startScene(seekNext)}
  else if(state==='over'){overT+=dt;if(overT>10)state='title'}
  else if(state==='end')endT+=dt;
  if(trk.y>LH+20){if(Math.random()<dt*.25){trk.y=-12;trk.h=4+Math.random()*9}}else trk.y+=dt*170;
}
function render(){
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  if(state==='title')drawTitle();
  else if(state==='seek')drawSeek();
  else if(state==='play'){const S=SC[si];S.draw(st,{});const m=S.moves[mi];if(m&&m.open&&!m.done)drawHint(m.key)}
  else if(state==='death'){
    const S=SC[si],m=dead.m,bt=dead.failT+Math.min(dead.dk,m.flow||0);
    S.draw(bt,{dead:true,mi:dead.mi,failT:dead.failT,dk:dead.dk,px:dead.pose.x});
    const d=dead.dk-(m.delay||0);
    if(d<0)hero(dead.pose);else drawDeath(m.death,dead.pose,d,S);
    if(dead.dk>2){c.fillStyle=`rgba(0,0,0,${clamp((dead.dk-2)/.4)})`;c.fillRect(0,0,LW,LH)}
  }
  else if(state==='over')drawOver();
  else if(state==='end')drawEnd();
  dirt();
}

/* ---------- input ---------- */
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'sword',Enter:'sword',KeyJ:'sword',KeyK:'sword'};
addEventListener('keydown',e=>{const k=KM[e.code];if(!k)return;e.preventDefault();if(!e.repeat)press(k)});
document.querySelectorAll('[data-k]').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');press(b.dataset.k)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('on')));
  b.addEventListener('click',e=>e.preventDefault());
});
let sx0=0,sy0=0,sdown=false;
out.addEventListener('pointerdown',e=>{e.preventDefault();sdown=true;sx0=e.clientX;sy0=e.clientY;au()});
out.addEventListener('pointerup',e=>{if(!sdown)return;sdown=false;const dx=e.clientX-sx0,dy=e.clientY-sy0;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)press('sword');else if(Math.abs(dx)>Math.abs(dy))press(dx>0?'right':'left');else press(dy>0?'down':'up')});
out.addEventListener('pointercancel',()=>{sdown=false});
['pointerup','touchend'].forEach(ev=>addEventListener(ev,au,{passive:true}));

try{document.fonts&&document.fonts.load('8px "Press Start 2P"');document.fonts&&document.fonts.load('900 20px Cinzel')}catch(e){}

/* ---------- loop: logic every frame, picture at 24 fps like film ---------- */
let last=performance.now(),acc=1;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;G+=dt;update(dt);acc+=dt;
  if(acc>=1/24){acc%=1/24;render();present()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
