<style>
/* Layout: a 1970s family room. Big wood console TV standing on shag carpet, wall paneling behind, stuff on top. The canvas is the picture tube. */
:root{
  color-scheme:dark;
  --wall-a:#4a2d17; --wall-b:#3a2211; --seam:#22130a;
  --wood:#6e3f1c; --wood-hi:#9a5f30; --wood-lo:#3e2310; --wood-edge:#2a170a;
  --shag:#9a4a18; --shag-lo:#5c2a0c; --shag-hi:#e08a3c;
  --fabric:#6b4a2a; --brass:#c9a24e; --brass-lo:#7d5f22;
  --cream:#f1e2bd; --tan:#e0c9a0; --amber:#ffb45a; --knob:#d9d2c4;
  --pixel:"Press Start 2P", ui-monospace, Menlo, monospace;
  --mono:"VT323", ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{margin:0;background:var(--wall-b);color:var(--cream);font-family:var(--mono);overflow-x:hidden}
.room{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;overflow:hidden;
  padding-inline:16px;padding-block:clamp(70px,11vw,150px) 0;
  background:
    radial-gradient(ellipse 45% 55% at 16% 38%, rgba(255,170,80,.30), transparent 70%),
    radial-gradient(ellipse 80% 40% at 50% 100%, rgba(0,0,0,.45), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(90deg, var(--wall-a) 0 2px, var(--wall-b) 2px 3px, var(--wall-a) 3px 96px, var(--seam) 96px 100px);}
.room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--floor-h,120px);z-index:0;
  background:
    radial-gradient(circle at 30% 40%, rgba(255,190,110,.40) 0 1.2px, transparent 2.4px) 0 0/7px 6px,
    radial-gradient(circle at 70% 60%, rgba(40,12,0,.55) 0 1.4px, transparent 2.6px) 3px 2px/6px 7px,
    radial-gradient(circle at 50% 50%, rgba(255,140,60,.30) 0 1px, transparent 2px) 1px 4px/5px 5px,
    radial-gradient(circle at 40% 30%, rgba(90,30,5,.5) 0 1.6px, transparent 3px) 2px 1px/9px 8px,
    linear-gradient(var(--shag-lo), var(--shag) 18%, #7a3812);
  box-shadow:inset 0 10px 18px -6px rgba(0,0,0,.7)}
.baseboard{position:absolute;left:0;right:0;bottom:var(--floor-h,120px);height:14px;background:linear-gradient(#5a3418,#2a170a);z-index:0}
.decor{position:absolute;z-index:0;pointer-events:none}
.clock{width:clamp(70px,8vw,120px);top:clamp(10px,2vh,30px);right:30%}
.hanger{width:clamp(60px,7vw,110px);top:0;left:6%}
.console{position:relative;z-index:2;width:min(100%,1240px);width:min(100%,1240px,calc((100dvh - 270px)/.54));margin-bottom:calc(var(--floor-h,120px) - 30px)}
.top-stuff{position:absolute;left:0;right:0;bottom:100%;height:0}
.lamp{position:absolute;bottom:-2px;left:3%;width:7%}
.lamp::before{content:"";position:absolute;left:-140%;right:-140%;top:-70%;height:180%;background:radial-gradient(closest-side,rgba(255,196,110,.5),transparent);opacity:calc(.6 + var(--d,0)*.4);pointer-events:none}
.photo{position:absolute;bottom:-1px;left:19%;width:6.5%}
.plant{position:absolute;bottom:-58%;right:2%;width:12%}
.cab{position:relative;border-radius:10px 10px 4px 4px;padding:2.2% 2.4% 1.6%;
  background:
    repeating-linear-gradient(88deg, rgba(0,0,0,.14) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(92deg, rgba(255,210,150,.07) 0 1px, transparent 1px 17px),
    linear-gradient(180deg,var(--wood-hi),var(--wood) 35%,var(--wood-lo));
  box-shadow:0 -3px 0 var(--wood-edge) inset,0 3px 0 rgba(255,220,170,.28) inset,0 30px 60px rgba(0,0,0,.6)}
.cab::before{content:"";position:absolute;left:-1%;right:-1%;top:-14px;height:16px;border-radius:6px 6px 2px 2px;
  background:linear-gradient(#b3743e,#7a4520 60%,#4a2810);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.face{position:relative;z-index:1;display:grid;grid-template-columns:19% minmax(0,1fr) 19%;gap:2.2%;align-items:stretch}
.grille{border-radius:8px;position:relative;overflow:hidden;
  background:
    repeating-linear-gradient(90deg, transparent 0 16%, rgba(40,20,6,.95) 16% 22%),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.25) 0 .6px, transparent 1px) 0 0/3px 3px,
    linear-gradient(var(--fabric),#4a3018);
  box-shadow:inset 0 0 0 5px var(--wood-lo),inset 0 0 0 7px rgba(0,0,0,.4),inset 0 8px 20px rgba(0,0,0,.6)}
.grille::before{content:"";position:absolute;inset:7px;border-radius:50% 50% 6px 6px / 22% 22% 6px 6px;box-shadow:0 0 0 999px rgba(62,35,16,.92),inset 0 0 0 2px rgba(255,210,150,.15)}
.right{display:flex;flex-direction:column;gap:6%}
.right .grille{flex:1}
.controls{border-radius:8px;padding:10% 8%;display:grid;grid-template-columns:1fr 1fr;gap:10px 6px;justify-items:center;
  background:linear-gradient(135deg,#e2c77e,var(--brass) 40%,var(--brass-lo));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.4)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.knob{width:clamp(34px,4.2vw,56px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;
  background:conic-gradient(from 0deg,#3a2a1c,#1a120c,#4a3626,#140e08,#3a2a1c);
  box-shadow:0 4px 7px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,220,160,.15);transition:transform .25s ease}
.knob::after{content:"";position:absolute;left:50%;top:8%;width:12%;height:30%;margin-left:-6%;background:var(--cream);border-radius:2px}
.knob:focus-visible{outline:2px solid #2a170a;outline-offset:3px}
.knob.off{transform:rotate(-120deg)}
.chan.turn{transform:rotate(60deg)}
.label{font-family:var(--pixel);font-size:clamp(5px,.55vw,7px);letter-spacing:.1em;color:#3a2410;text-transform:uppercase}
.power{grid-column:1/-1;display:flex;align-items:center;gap:6px}
.led{width:8px;height:8px;border-radius:50%;background:#4a1a0c;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);transition:background .3s,box-shadow .3s}
.led.on{background:#ff5a2a;box-shadow:0 0 10px #ff5a2a}
.pwr{font-family:var(--pixel);font-size:clamp(6px,.6vw,8px);letter-spacing:.12em;color:#2a1a0a;background:linear-gradient(#f4ecd8,#bdb4a2);border:0;border-radius:4px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 #6b5a3a,inset 0 1px 0 #fff}
.pwr:active,.pwr.in{transform:translateY(2px);box-shadow:0 1px 0 #6b5a3a,inset 0 1px 0 #fff}
.pwr:focus-visible{outline:2px solid #2a170a;outline-offset:2px}
.tube{background:#120e0b;border-radius:14px;padding:3.2%;box-shadow:inset 0 0 0 3px #c9a24e,inset 0 0 0 5px #5a4220,inset 0 8px 18px rgba(0,0,0,.85)}
.screen{position:relative;aspect-ratio:4/3;width:100%;max-width:100%;border-radius:7%/9%;overflow:hidden;background:#000;box-shadow:0 0 0 3px #050505}
.screen canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.glass{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 0 70px rgba(0,0,0,.75),inset 0 0 10px rgba(0,0,0,.9);
  background:radial-gradient(ellipse 30% 22% at 12% 14%,rgba(255,190,110,.14),transparent 70%),radial-gradient(ellipse at 26% 10%,rgba(255,255,255,.09),transparent 38%),linear-gradient(160deg,rgba(255,255,255,.05),transparent 32%)}
.plate{margin:1.4% auto 0;width:max-content;font-family:var(--pixel);font-size:clamp(6px,.7vw,9px);letter-spacing:.3em;color:#3a2410;padding:4px 10px;border-radius:3px;background:linear-gradient(#ecd48e,#b08a3a);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.cab::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(10,8,30,.5);opacity:var(--d,0);pointer-events:none}
.grille,.controls,.plate,.photo,.plant{filter:brightness(calc(1 - var(--d,0)*.45))}
.dusk{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:var(--d,0);background:radial-gradient(ellipse 34% 40% at 50% 50%,rgba(10,8,30,.08),rgba(10,8,30,.66) 75%)}
.plinth{height:26px;margin:0 1.5%;border-radius:0 0 6px 6px;background:linear-gradient(#4a2810,#24140a);box-shadow:0 14px 20px rgba(0,0,0,.6)}
.plinth::before{content:"";display:block;height:4px;background:linear-gradient(90deg,transparent,rgba(255,200,140,.15),transparent)}
.floor-ui{position:absolute;z-index:3;left:0;right:0;bottom:0;height:var(--floor-h,120px);box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:34px 16px 10px}
.hint{font-size:21px;color:var(--tan);text-align:center;margin:0;letter-spacing:.02em;text-wrap:balance;max-width:70ch;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.hint b{color:#fff3d6;font-weight:400}
.joy{position:absolute;z-index:1;left:8%;bottom:10px;width:clamp(60px,7vw,100px);pointer-events:none}
.pad{display:none;width:min(100%,560px);justify-content:space-between;align-items:center;gap:10px}
.pad .grp{display:flex;gap:10px}
.pb{font-family:var(--pixel);font-size:14px;color:var(--cream);background:linear-gradient(#3a2716,#24170d);border:2px solid #5a3a22;border-radius:14px;min-width:62px;height:62px;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #120a05}
.pb.jump{min-width:96px;background:linear-gradient(#b8452a,#7c2a18);border-color:#d0643e}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 #120a05}
@media (pointer:coarse){.pad{display:flex}.hint.keys{display:none}.joy{display:none}}
@media (max-width:760px){
  .room{--floor-h:170px;padding-block:90px 0}
  .face{grid-template-columns:minmax(0,1fr)}
  .face>.grille{display:none}
  .right{flex-direction:row}
  .right .grille{display:none}
  .controls{grid-template-columns:repeat(3,auto);justify-content:space-around;padding:8px;width:100%;box-sizing:border-box}
  .power{grid-column:auto}
  .cab{padding:3%}
  .photo,.clock{display:none}
  .lamp{width:20%}.plant{width:22%;bottom:-40%}
}
@media (max-width:420px){.pad,.pad .grp{gap:6px}.pb{min-width:52px;height:56px;font-size:12px}.pb.jump{min-width:78px}}
@media (prefers-reduced-motion:reduce){.knob{transition:none}}
</style>

<script>
(()=>{
"use strict";
const W=800,H=600,GY=380,CEIL=455,TY=565,GRAV=1150;
const scr=document.getElementById('screen'); const sx=scr.getContext('2d');
const g=document.createElement('canvas'); const c=g.getContext('2d');
const small=document.createElement('canvas'); small.width=200; small.height=150; const smx=small.getContext('2d');
let K=0, BG=[], VIG=null, SCANP=null, NOISEP=[], NOISEC=[], PL=null;
const AI={l:0,r:0,u:0,d:0};
const CHS=[3,4,5,6];
const STARS=[...Array(90)].map(()=>({x:Math.random()*800,y:Math.random()*420,s:Math.random()*1.5+.3,p:Math.random()*6}));
const PIX='"Press Start 2P", ui-monospace, monospace';
const D=(b,a)=>G.diff==='A'?a:b;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>t*t*(3-2*t);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- the jungle: 255 screens from an 8 bit shift register ---------- */
function lfsr(s){const b=((s>>3)^(s>>4)^(s>>5)^(s>>7))&1;return((s<<1)|b)&255}
const SEEDS=[];{let s=0xC4;do{SEEDS.push(s);s=lfsr(s)}while(s!==0xC4&&SEEDS.length<255)}
const N=SEEDS.length;
const OBJ=[{r:[700]},{r:[620,690]},{r:[520,760]},{r:[540,640,740]},{s:[660]},{s:[590,665,740]},{fire:660},{cobra:660}];
const TRE=[{n:'MONEY BAG',v:2000},{n:'SILVER BAR',v:3000},{n:'GOLD BAR',v:4000},{n:'DIAMOND RING',v:5000}];
const KINDS=[null,null,'tar','water','croc','tar','quick','water'];
function decode(i){
  const s=SEEDS[i],t=(s>>3)&7;
  const sc={i,s,t,trees:(s>>6)&3,holes:[],pit:null,vine:false,ladder:false,obj:null,tre:null,wall:null,scorp:false};
  if(t<2){sc.ladder=true;sc.holes=t===0?[400]:[250,400,550]}
  else sc.pit={kind:KINDS[t],shift:t>=5};
  if(t===2||t===3)sc.vine=true;

  if(o.vib){const l=ctx.createOscillator();l.frequency.value=o.vib;const lg=ctx.createGain();lg.gain.value=f*.05;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.02)}

  const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;const gn=ctx.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+1);gn.gain.linearRampToValueAtTime(v*.35,t+3);gn.gain.linearRampToValueAtTime(0,t+7);

function spark(x,y,n,col,o={}){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(o.sp||80)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0),g:o.g??300,life:o.life||.6,max:o.life||.6,size:o.size||2,col,type:o.type||'dot'})}}

/* ---------- update ---------- */
function update(dt){
  G.pt+=dt;
  G.dusk=((G.state==='play'&&!G.demo)||G.state==='over')?clamp(1-G.time/1200,0,1):0;
  if(G.power==='warming'&&G.pt>2.3){G.power='on';G.osd=3}
  if(G.power==='cooling'&&G.pt>3.2)G.power='off';
  if(G.power==='off'||(G.power==='cooling'&&G.pt>.25))return;
  G.t+=dt;G.osd=Math.max(0,G.osd-dt);G.flip=Math.max(0,G.flip-dt);
  if(G.ch!==3){JP.jump=JP.down=false;return}
  if(G.state==='title'&&G.power==='on'){G.idle+=dt;if(G.idle>9){startGame(true);return}}
  const sc=cur();
  if(!G.pause){
    for(let i=0;i<logs.length;i++){logs[i]-=D(60,86)*dt;if(logs[i]<-30)logs[i]+=860}
    if(sc.scorp){
      const under=G.state==='play'&&P&&P.y>GY+8&&P.st!=='dead';
      if(under){const dx=P.x-scorp.x;if(Math.abs(dx)>3){scorp.d=Math.sign(dx);scorp.x+=scorp.d*D(36,52)*dt}}
      else{scorp.x+=scorp.d*22*dt;if(scorp.x<170)scorp.d=1;if(scorp.x>630)scorp.d=-1}
      if(sc.wall!==null){if(scorp.d>0&&scorp.x>sc.wall-18&&scorp.x<sc.wall+17)scorp.x=sc.wall-18;if(scorp.d<0&&scorp.x<sc.wall+52&&scorp.x>sc.wall+17)scorp.x=sc.wall+52}
      scorp.x=clamp(scorp.x,20,780);
    }
    if(Math.random()<dt*.5)parts.push({x:Math.random()*W,y:120+Math.random()*30,vx:-8,vy:22,g:0,life:12,max:12,size:3+Math.random()*2,col:Math.random()<.5?'#9cc24a':'#d9b64a',type:'leaf',rot:Math.random()*6,sw:Math.random()*6});
  if(sc.obj&&sc.obj.fire&&Math.random()<dt*9)parts.push({x:sc.obj.fire+(Math.random()-.5)*14,y:GY-20,vx:(Math.random()-.5)*20,vy:-50-Math.random()*40,g:-10,life:1.1,max:1.1,size:1.6,col:'255,170,60',type:'glow'});
    for(const m of MOTES){m.x+=6*dt;m.y+=Math.sin(G.t*.6+m.p)*4*dt;if(m.x>W)m.x=0}
    for(const f of FLIES){f.x+=Math.sin(G.t*f.v+f.p)*14*dt;f.y+=Math.cos(G.t*f.v*1.3+f.p)*8*dt}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;
      if(p.type==='leaf'){p.x+=Math.sin(G.t*1.6+p.sw)*18*dt;p.rot+=dt*1.5;if(p.y>GY-2)p.life=Math.min(p.life,.6)}
      if(p.life<=0)parts.splice(i,1)}
  }
  ambient(dt,sc);
  if(G.state==='over')G.overT+=dt;
  if(G.state!=='play'||G.pause){JP.jump=JP.down=false;return}
  if(G.handoff>0){G.handoff-=dt;JP.jump=JP.down=false;return}
  if(G.demo){G.demoT+=dt;if(G.demoT>50){endDemo();return}aiThink(sc)}
  G.time-=dt;if(G.time<=0){G.time=0;if(PL)nextTurn('time');else gameOver('time');return}
  if(sc.pit&&sc.pit.kind==='croc'){const o=crocOpen();if(G.croc>.05&&o<=.05)SFX.snap();G.croc=o}
  updatePlayer(dt,sc);
  JP.jump=JP.down=false;
}

function aiLand(p){const fl=p.y>GY+8?TY:GY,dy=Math.max(0,fl-p.y);return p.x+p.vx*((p.vy+Math.sqrt(p.vy*p.vy+2*GRAV*dy))/GRAV)}
function aiThink(sc){
  const p=P;AI.l=AI.r=AI.u=AI.d=0;if(!p||p.st==='dead'||p.st==='sink')return;
  const under=p.y>GY+8,go=d=>{if(d>0)AI.r=1;else if(d<0)AI.l=1},jump=t=>{JP.jump=true;G.aiT=t;if(t!=null)AI.r=t-p.x>45?1:0};
  const ahead=(a,lo,hi)=>{const d=(a-p.x)*G.aiDir;return d>lo&&d<hi};
  if(p.st==='vine'){const v=vine();if(v.x>492&&v.vx>-5){JP.jump=true;G.aiT=570;AI.r=1}return}
  if(p.st==='ladder'){AI.u=1;if(p.y<=GY+5)AI.r=1;return}
  if(p.st==='air'){if(G.aiT==null){go(G.aiDir);return}const xl=aiLand(p);if(xl<G.aiT-4)AI.r=1;else if(xl>G.aiT+4)AI.l=1;return}
  if(p.st!=='ground')return;
  G.aiT=null;
  if(under){
    const w=sc.wall,blocked=w!==null&&w+34>Math.min(p.x,400)&&w<Math.max(p.x,400);
    if(sc.ladder&&!blocked){if(Math.abs(p.x-400)<12){AI.u=1;return}G.aiDir=Math.sign(400-p.x)}
    else if(w!==null&&ahead(G.aiDir>0?w:w+34,0,16))G.aiDir*=-1;
    if(sc.scorp&&ahead(scorp.x,38,74))jump(null);
    go(G.aiDir);return;
  }
  G.aiDir=1;
  if(p.trip>0)return;
  let full=0,dz=9999,edgeStop=9999;
  if(sc.pit){full=D(130,140);dz=400-(full-D(14,8));edgeStop=dz-10}
  const nearEdge=p.x<dz&&p.x>dz-100;
  const stat=sc.obj&&sc.obj.s||[];
  let hop=false;
  if(!nearEdge)for(const lx of logs)if(ahead(lx,40,80))hop=true;
  for(const lx of stat)if(ahead(lx,36,56))hop=true;
  const hz=sc.obj&&(sc.obj.fire||sc.obj.cobra);if(hz&&ahead(hz,34,58))hop=true;
  for(const h of sc.holes)if(ahead(h,24,46))hop=true;
  if(hop){let t=null;const L=p.x+93;for(const h of sc.holes)if(Math.abs(L-h)<20)t=h-p.x-24>30?h-24:h+26;AI.r=1;jump(t);return}
  for(const lx of stat)if(ahead(lx,0,36)){AI.l=1;return}
  if(sc.pit){
    const hw=pitHalf(sc),onPit=p.x>=dz-2&&p.x<400+(full-D(14,8));
    if(sc.vine&&!onPit&&p.x<dz){if(p.x<edgeStop-6){AI.r=1;return}const v=vine();if(v.x<335&&v.vx<0)jump(p.x);return}
    if(sc.pit.kind==='croc'){
      const ph=(G.t%2.8)/2.8,heads=[330,400,470],on=heads.find(h=>Math.abs(p.x-h)<20);
      if(on!==undefined){const nx=heads.find(h=>h>on);jump(nx===undefined?400+full+22:nx);return}
      if(p.x<dz){if(p.x<edgeStop-6){AI.r=1;return}if(ph>.18&&ph<.27)jump(330);return}
    }else if(sc.pit.shift&&p.x<dz&&p.x>=edgeStop-6){const pp=(G.t%7)/7;if(hw<2&&(pp>.93||pp<.02))AI.r=1;return}
  }
  AI.r=1;
}
function land(){const p=P;p.st='ground';p.vy=0;p.vmax=0;SFX.land();spark(p.x,p.y,6,'#c9ab63',{sp:50,up:40,life:.4,g:200})}
function sink(){P.st='sink';P.dt=0;SFX.splash();const k=cur().pit.kind;spark(P.x,GY,16,k==='tar'?'#2a2030':k==='quick'?'#c99a52':'#9fd6f5',{sp:90,up:120,life:.7,g:500,size:2.5})}
function die(why){
  const p=P;if(p.st==='dead')return;
  p.st='dead';p.why=why;p.dt=0;p.vy=(why==='sink'||why==='croc')?0:-260;G.lives--;SFX.die();
  if(why==='burn')spark(p.x,p.y-20,24,'255,150,50',{type:'glow',sp:120,life:.8,g:-40});
}
function respawn(){if(G.demo){endDemo();return}nextTurn(G.lives<=0?'lives':'')}
function wallCheck(sc,px){
  if(sc.wall===null)return;const a=sc.wall,b=sc.wall+34,p=P;
  if(p.x+9>a&&p.x-9<b){p.x=px+9<=a+1||px<a+17?a-9:b+9;if(p.st==='air')p.vx=0}
}
function collect(sc){
  const tr=TRE[sc.tre];G.found.add(sc.i);G.score+=tr.v;SFX.treasure();
  spark(660,GY-14,30,'255,220,120',{type:'glow',sp:140,up:60,life:1,g:80});
  popText(660,GY-60,'+'+tr.v,'#ffe08a');
  if(G.found.size>=TOTAL)gameOver('win');
}

function updatePlayer(dt,sc){
  const I=G.demo?AI:KEY;
  const p=P;
  p.hurt=Math.max(0,p.hurt-dt);p.trip=Math.max(0,p.trip-dt);p.vcd=Math.max(0,p.vcd-dt);
  if(p.st==='dead'){p.dt+=dt;if(p.why==='sink'||p.why==='croc')p.y+=16*dt;else{p.vy+=GRAV*.6*dt;p.y+=p.vy*dt}if(p.dt>1.9)respawn();return}
  if(p.st==='sink'){p.y+=42*dt;p.dt+=dt;if(p.dt>.55)die('sink');return}
  const dir=(I.r?1:0)-(I.l?1:0);
  const under=p.y>GY+8;
  if(p.st==='ground'){
    const sp=p.trip>0?35:155,px=p.x;p.vx=dir*sp;if(dir)p.face=dir;p.x+=p.vx*dt;
    if(dir){p.ph+=dt*13;const st=Math.floor(p.ph/Math.PI);if(st!==p.step){p.step=st;SFX.step()}}else p.ph=0;
    if(JP.jump){p.st='air';p.vy=-345;p.vmax=155;SFX.jump()}
    else if(!under&&sc.ladder&&(JP.down||I.d)&&Math.abs(p.x-400)<34){p.st='ladder';p.x=400;p.y=GY+6}
    else if(under&&sc.ladder&&I.u&&Math.abs(p.x-400)<16){p.st='ladder';p.x=400}
    if(under)wallCheck(sc,px);
    if(p.st==='ground'&&!under){
      if(holeAt(sc,p.x)){p.st='fall';p.vy=0;G.score=Math.max(0,G.score-100);SFX.fall();popText(p.x,GY-70,'-100','#ff9a7a')}
      else if(sc.pit){const hw=pitHalf(sc);
        if(hw>10&&Math.abs(p.x-400)<hw-D(14,8)){
          if(sc.pit.kind==='croc'){const h=[330,400,470].find(hx=>Math.abs(p.x-hx)<20);if(h===undefined)sink();else if(crocOpen()>D(.4,.2)){die('croc');SFX.snap()}}
          else sink();
        }}
    }
  }else if(p.st==='air'){
    if(dir){p.vx+=dir*520*dt;const m=Math.max(155,p.vmax);p.vx=clamp(p.vx,-m,m);p.face=dir}
    const px=p.x;p.vy+=GRAV*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(under){
      if(p.y-58<CEIL){p.y=CEIL+58;if(p.vy<0)p.vy=0}
      wallCheck(sc,px);if(p.y>=TY){p.y=TY;land()}
    }else{
      if(sc.vine&&p.vcd<=0){const v=vine();if(Math.hypot(p.x-v.x,(p.y-49)-v.y)<D(40,30)){p.st='vine';SFX.yell();return}}
      if(p.y>=GY&&p.vy>0){if(holeAt(sc,p.x)){p.st='fall';G.score=Math.max(0,G.score-100);SFX.fall();popText(p.x,GY-70,'-100','#ff9a7a')}else{p.y=GY;land()}}
    }
  }else if(p.st==='fall'){
    p.vy+=GRAV*dt;p.y+=p.vy*dt;if(p.y>=TY){p.y=TY;land();SFX.thud()}
  }else if(p.st==='vine'){
    const v=vine();p.x=v.x;p.y=v.y+49;if(Math.abs(v.vx)>20)p.face=v.vx>0?1:-1;
    if(JP.jump||JP.down){p.st='air';p.vx=v.vx*1.05+dir*110;p.vmax=Math.max(155,Math.abs(p.vx));p.vy=Math.min(0,v.vy)-170;p.vcd=.45;SFX.jump()}
  }else if(p.st==='ladder'){
    const dy=(I.d?1:0)-(I.u?1:0);p.y+=dy*120*dt;p.ph+=Math.abs(dy)*dt*10;
    if(p.y>=TY){p.y=TY;if(dir){p.st='ground';p.face=dir}}
    if(p.y<=GY+4){p.y=GY+4;if(dir||JP.jump){const d=dir||p.face;p.st='ground';p.y=GY;p.x=400+d*34;p.face=d}}
  }
  if(p.st==='ground'||p.st==='air'){
    const u=p.y>GY+8;
    if(p.x>800){G.idx=(G.idx+(u?3:1))%N;p.x-=800;enterScene(SC[G.idx])}
    else if(p.x<0){G.idx=(G.idx-(u?3:1)+N*3)%N;p.x+=800;enterScene(SC[G.idx])}
    const s2=SC[G.idx];
    if(!u){
      const L=logs.concat(s2.obj&&s2.obj.s?s2.obj.s:[]);
      for(const lx of L){if(Math.abs(p.x-lx)<22&&p.y>GY-22&&p.hurt<=0){G.score=Math.max(0,G.score-100);p.trip=.5;p.hurt=.9;SFX.thud();spark(lx,GY-12,10,'#8a5a2c',{sp:70,up:60,life:.5});popText(p.x,GY-70,'-100','#ff9a7a')}}
      const o=s2.obj;
      if(o&&o.fire&&Math.abs(p.x-o.fire)<D(14,18)&&p.y>GY-30)die('burn');
      if(o&&o.cobra&&Math.abs(p.x-o.cobra)<D(14,18)&&p.y>GY-34)die('bite');
      if(s2.tre!==null&&!G.found.has(s2.i)&&Math.abs(p.x-660)<26&&p.y>GY-70)collect(s2);
    }else if(s2.scorp&&Math.abs(p.x-scorp.x)<22&&p.y>TY-24)die('sting');
  }
}

  if(clip){c.beginPath();c.rect(0,0,W,GY+1);c.clip()}

  const spin=p.st==='dead'&&!clip?Math.min(p.dt*7,Math.PI*.5):0;

  c.restore();
}
function drawParticles(){

    else if(p.type==='text'){c.save();c.globalAlpha=Math.min(1,a*2);c.font=`12px ${PIX}`;c.textAlign='center';c.fillStyle='rgba(0,0,0,.6)';c.fillText(p.txt,p.x+2,p.y+2);c.fillStyle=p.col;c.fillText(p.txt,p.x,p.y);c.restore()}

    c.fillStyle='#07080f';c.beginPath();c.moveTo(0,H);c.lineTo(0,500);for(let x=0;x<=W;x+=40)c.lineTo(x,492+Math.sin(x*.02)*10);c.lineTo(W,H);c.fill();
    c.strokeStyle='#0b0d18';c.lineWidth=3;c.beginPath();c.moveTo(560,500);c.lineTo(620,190);c.lineTo(680,500);for(let y=230;y<500;y+=34){const f=(y-190)/310;c.moveTo(620-60*f,y);c.lineTo(620+60*f,y+34);c.moveTo(620+60*f,y);c.lineTo(620-60*f,y+34)}c.stroke();
    if(Math.floor(G.t*1.2)%2===0){c.save();c.globalCompositeOperation='lighter';const rg=c.createRadialGradient(620,186,0,620,186,22);rg.addColorStop(0,'rgba(255,60,40,.95)');rg.addColorStop(1,'rgba(255,60,40,0)');c.fillStyle=rg;c.fillRect(598,164,44,44);c.restore()}
    txt('THIS CONCLUDES',300,170,16,'#f3e6c4','center');txt('OUR BROADCAST DAY',300,200,16,'#f3e6c4','center');

function render(){

  c.setTransform(K,0,0,K,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;

const tmp=document.createElement('canvas'),tcx=tmp.getContext('2d');
function offGlass(){const w=scr.width,h=scr.height;sx.setTransform(1,0,0,1,0,0);sx.globalCompositeOperation='source-over';sx.globalAlpha=1;
  const gr=sx.createRadialGradient(w*.5,h*.42,0,w*.5,h*.5,w*.7);gr.addColorStop(0,'#1e2420');gr.addColorStop(1,'#060807');sx.fillStyle=gr;sx.fillRect(0,0,w,h);
  const rf=sx.createRadialGradient(w*.18,h*.16,0,w*.18,h*.16,w*.3);rf.addColorStop(0,'rgba(255,180,100,.07)');rf.addColorStop(1,'rgba(255,180,100,0)');sx.fillStyle=rf;sx.fillRect(0,0,w,h);
  if(VIG)sx.drawImage(VIG,0,0)}
function glowDot(r,a){const w=scr.width,h=scr.height;sx.save();sx.globalCompositeOperation='lighter';const gr=sx.createRadialGradient(w/2,h/2,0,w/2,h/2,r*7);

function glowLine(lw,lh,a){const w=scr.width,h=scr.height;sx.save();sx.globalCompositeOperation='lighter';

function snap(){if(tmp.width!==scr.width||tmp.height!==scr.height){tmp.width=scr.width;tmp.height=scr.height}tcx.globalCompositeOperation='copy';tcx.drawImage(scr,0,0)}
function present(){
  const w=scr.width,h=scr.height,t=G.pt,P2=G.power;
  if(P2==='off'){offGlass();return}
  if(P2==='warming'&&t<.34){offGlass();if(t<.12)glowDot((1.5+t/.12*4)*K,1);else{const e=ease((t-.12)/.22);glowLine(Math.max(6*K,w*e),2.5*K,1);glowDot(4*K,1-e)}return}

    sx.fillStyle='rgba(0,0,0,.5)';for(let i=0;i<4;i++)sx.fillRect(0,Math.random()*h,w,(8+Math.random()*30)*K);sx.globalAlpha=1;

/* ---------- boot ---------- */
let last=performance.now();
let lastD=-1;const rootEl=document.documentElement;
function frame(now){if(Math.abs(G.dusk-lastD)>.008){lastD=G.dusk;rootEl.style.setProperty('--d',G.dusk.toFixed(3))}const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden){update(dt);if(G.power!=='off'&&!(G.power==='cooling'&&G.pt>.25))render();present()}requestAnimationFrame(frame)}

const fontReady=document.fonts&&document.fonts.load?document.fonts.load(`16px ${PIX}`):Promise.resolve();
Promise.race([fontReady,new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).then(boot);
})();
